<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History — Arena</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='arena/arena.css') }}">
</head>
<body>
  <div id="nav"></div>
  <div class="arena-wrap">
    <section class="card">
      <h2>History</h2>
      <p class="sub">Sessions, scores, and what the AI has learned so far.</p>
      <div class="stat-row" id="teams"></div>
      <div id="history" style="margin-top:1rem" class="card">Loading…</div>
    </section>
    <section class="card">
      <h2>AI learning state</h2>
      <p class="sub">Movie weights shift every time you mark a guess right or wrong. This is the agent's actual memory.</p>
      <div id="learning"></div>
      <button class="btn bad small" id="reset-learning" style="margin-top:.8rem">Reset AI learning</button>
    </section>
  </div>
  <script src="/static/arena/arena.js"></script>
  <script>
    document.querySelector('#nav').innerHTML = arenaNav('/history');

    async function load() {
      try {
        const [history, learning] = await Promise.all([
          ArenaAPI.get('/api/arena/history'), ArenaAPI.get('/api/arena/learning')]);
        const teams = history.teams || {};
        document.querySelector('#teams').innerHTML = Object.entries(teams)
          .map(([team, data]) => `<div class="stat"><b>${data.score}</b><span>${team}</span></div>`).join('');
        const rows = history.sessions.map(session => {
          const when = new Date(session.created_at * 1000).toLocaleString();
          const detail = session.detail?.movie || (session.detail?.score !== undefined ? `${session.detail.score}/100` : '');
          return `<div class="history-row"><span><span class="outcome ${session.outcome}">${session.mode}</span>
            <b style="margin-left:.5rem">${detail}</b></span><span class="when">${when}</span></div>`;
        }).join('');
        document.querySelector('#history').innerHTML = rows || 'No sessions yet.';
        const weights = Object.entries(learning.movie_weights || {});
        document.querySelector('#learning').innerHTML = weights.length
          ? weights.map(([title, weight]) => `
            <div class="bar-row"><span class="name">${title}</span>
            <span class="pct">${weight > 1 ? '+' : ''}${((weight - 1) * 100).toFixed(0)}%</span>
            <div class="meter"><i style="width:${Math.min(100, weight * 50)}%;background:${weight >= 1 ? 'var(--grad)' : 'var(--grad2)'}"></i></div></div>`).join('')
          : '<p class="small muted">Neutral — play a round of charades and the weights will move.</p>';
      } catch (error) {
        document.querySelector('#history').textContent = error.message;
      }
    }

    document.querySelector('#reset-learning').addEventListener('click', async () => {
      if (!window.confirm('Reset all AI learning (movie weights and player profiles)?')) return;
      await ArenaAPI.post('/api/arena/learning/reset');
      arenaToast('Learning reset.');
      load();
    });
    load();
  </script>
</body>
</html>
