<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Lab — Arena</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='arena/arena.css') }}">
</head>
<body>
  <div id="nav"></div>
  <div class="arena-wrap">
    <section class="card">
      <h2>🧪 AI LAB</h2>
      <p class="sub">Developer view: perception pipeline internals, raw confidences, and live logs.</p>
      <div class="hud" id="hud"></div>
      <div class="grid cols-2">
        <div>
          <div class="camera-shell" id="shell">
            <video id="camera" autoplay muted playsinline></video>
            <canvas id="overlay" class="overlay-canvas"></canvas>
            <div class="warn-banner" hidden></div>
            <div class="placeholder">Camera preview appears here.</div>
          </div>
          <div style="margin-top:.8rem">
            <button class="btn primary" id="start">Start perception</button>
            <button class="btn" id="stop" disabled>Stop</button>
          </div>
          <div class="readout" style="margin-top:1rem" id="raw"></div>
        </div>
        <div class="card">
          <h2>Live log</h2>
          <p class="sub">Classifier outputs and API round trips.</p>
          <div id="log" style="font-family:Consolas,monospace;font-size:.72rem;max-height:420px;overflow:auto;color:var(--muted)"></div>
        </div>
      </div>
    </section>
  </div>
  <script src="/static/arena/arena.js"></script>
  <script>
    document.querySelector('#nav').innerHTML = arenaNav('/lab');
    const $ = s => document.querySelector(s);
    const camera = new ArenaCamera({
      video: $('#camera'), canvas: $('#overlay'), hud: $('#hud'), windowSize: 24,
    });
    let busy = false;
    const log = (line) => {
      const target = $('#log');
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${line}`;
      target.prepend(entry);
      while (target.children.length > 120) target.lastChild.remove();
    };

    $('#start').addEventListener('click', async () => {
      try {
        await camera.start();
        $('#shell').classList.add('active');
        $('#placeholder').hidden = true;
        $('#start').disabled = true; $('#stop').disabled = false;
        log('WASM landmarkers loaded (hands, face, pose)');
        camera.onFrame = async frame => {
          if (busy) return;
          busy = true;
          try {
            const data = await ArenaAPI.post('/api/arena/perceive', camera.snapshot());
            const a = data.analysis || {};
            log(`fps=${frame.fps} latency=${frame.latency}ms ` +
                `hand=${frame.detection.hand} face=${frame.detection.face} pose=${frame.detection.pose} ` +
                `gesture=${a.gesture ? a.gesture.label + ':' + a.gesture.confidence : '—'} ` +
                `action=${a.action ? a.action.label + ':' + a.action.confidence : '—'} ` +
                `expr=${a.expression ? a.expression.label + ':' + a.expression.confidence : '—'}`);
            $('#raw').innerHTML = [
              ['FPS', frame.fps], ['Latency', frame.latency + ' ms'],
              ['Hand landmarks', frame.hands.length * 21],
              ['Face landmarks', frame.face.length],
              ['Pose landmarks', frame.pose.length],
              ['Gesture', a.gesture ? `${a.gesture.label} (${a.gesture.confidence})` : '—'],
              ['Action', a.action ? `${a.action.label} (${a.action.confidence})` : '—'],
              ['Expression', a.expression ? `${a.expression.label} (${a.expression.confidence})` : '—'],
            ].map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
          } catch (error) { log('API error: ' + error.message); }
          finally { busy = false; }
        };
      } catch (error) { arenaToast(error.message); }
    });
    $('#stop').addEventListener('click', () => {
      camera.stop();
      $('#shell').classList.remove('active');
      $('#placeholder').hidden = false;
      $('#start').disabled = false; $('#stop').disabled = true;
      log('Perception stopped');
    });
    window.addEventListener('beforeunload', () => camera.stop());
  </script>
</body>
</html>
